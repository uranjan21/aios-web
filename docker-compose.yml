services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: control_tower
      POSTGRES_PASSWORD: control_tower_dev_password
      POSTGRES_DB: control_tower
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_tower -d control_tower"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://control_tower:control_tower_dev_password@db:5432/control_tower
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ${VAULT_PATH}:${VAULT_PATH}:rw
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: apps/shell/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    command: pnpm dev --host

volumes:
  pgdata:
