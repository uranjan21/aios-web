# =============================================================================
# LOCAL DEVELOPMENT ONLY.
#
# Production is a single container built from the repo-root Dockerfile and run
# on a PaaS against Supabase Postgres — see docs/DEPLOYMENT.md. There is no
# production compose file: nothing here describes how the app is deployed.
#
# Every published port binds to 127.0.0.1, so nothing is reachable from outside
# this machine even if the stack is started on a public host.
#
# The frontend is NOT a service here. It runs on the host (`pnpm dev` in
# frontend/, or ./run.sh which starts both), proxying /api and /ws to the
# backend below — which is how the project has actually been developed.
# =============================================================================

# Pinned, NOT derived from the directory name. Compose otherwise defaults the
# project name to the containing folder, so renaming the checkout would create a
# fresh empty pgdata volume and silently abandon the one holding your dev data.
name: control-tower

services:
  db:
    # pgvector, because vault_chunks.embedding is a vector(1536) column and
    # migration 0001 creates the extension. Plain postgres:15 cannot run it.
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: control_tower
      POSTGRES_PASSWORD: control_tower_dev_password
      POSTGRES_DB: control_tower
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_tower -d control_tower"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Present in dev so the rate limiter and the pending-tool-call store take
    # the same code path as production rather than per-process memory.
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://control_tower:control_tower_dev_password@db:5432/control_tower
      REDIS_URL: redis://redis:6379/0
      # No SPA bundle in this image; the Vite dev server on the host serves the
      # frontend. app/core/spa.py treats a missing bundle as normal.
      SPA_DIST_DIR: /nonexistent
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      # Vault sync is opt-in locally; defaults to a throwaway directory so the
      # stack still comes up when VAULT_PATH is unset or points at a path that
      # only exists on one laptop.
      - ${VAULT_PATH:-./.vault-dev}:${VAULT_PATH:-/tmp/vault}:rw
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The bind mount above shadows the image's app/, so --reload is useful here.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
