name: Deploy

# Push to main → CI must pass → publish the deployable image to GHCR, then let
# the hosting platform take it.
#
# There is no server to SSH into any more. The app runs on a PaaS against
# Supabase Postgres:
#
#   Render / Railway  — deploy themselves from this repo on every commit
#                       (render.yaml sets autoDeployTrigger: commit). Nothing
#                       here needs to run for them; the GHCR image is a
#                       convenience and a build gate.
#   Fly.io            — needs a push, so this workflow does it when
#                       FLY_API_TOKEN is configured. Without that secret the
#                       job is skipped, not failed.
#
# See docs/DEPLOYMENT.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: tags
        # Lowercase: GHCR rejects uppercase path segments and GitHub usernames
        # may contain them.
        run: |
          IMG="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMG}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repo=${IMG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}
            ${{ steps.tags.outputs.repo }}:latest
          # Vite inlines import.meta.env.VITE_* at BUILD time. Setting them on
          # the running container does nothing, so they have to be build args
          # and therefore repo secrets. Unset resolves to "" — analytics off,
          # which is the default and harmless.
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

  fly:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: guard
        # Secrets cannot be evaluated in a job-level `if`, so the check happens
        # here and the remaining steps read its output. A repo that does not use
        # Fly skips this quietly rather than failing every push to main.
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN not set — skipping Fly deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.guard.outputs.configured == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - if: steps.guard.outputs.configured == 'true'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
