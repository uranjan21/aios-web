name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # Called by deploy.yml so a push to main can't ship a red build.
  workflow_call:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: control_tower
          POSTGRES_PASSWORD: control_tower
          POSTGRES_DB: control_tower_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://control_tower:control_tower@localhost:5432/control_tower_test
      APP_SECRET_KEY: ci-test-secret-key-32-chars-minimum
      # APP_PASSWORD is deliberately NOT set here. tests/conftest.py does
      # os.environ.setdefault("APP_PASSWORD", "testpass") and test_auth.py logs
      # in with "testpass" — setting it here makes the setdefault a no-op and
      # every auth test 401s. Same for APP_EMAIL (conftest → admin@example.com).
      ANTHROPIC_API_KEY: sk-placeholder
      ALLOWED_ORIGIN: http://localhost:5173
      VAULT_PATH: /tmp/vault
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY || 'dGVzdC1rZXktZm9yLWNpLW9ubHktZG8tbm90LXVzZS1pbi1wcm9k' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: backend
        run: uv pip install -e ".[dev]" --system

      # `python -m pytest`, not `uv run pytest` — uv run would build a second,
      # separate venv that never got the [dev] extras installed above.
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend (TypeScript + Build)
    runs-on: ubuntu-latest

    # The pnpm workspace root moved from the repo root to frontend/ on
    # 2026-07-28, so every `run` step executes there. Action *inputs* ignore
    # `defaults.run.working-directory`, so the two paths below stay
    # repo-root-relative and must be spelled out.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @ledgr/ui must be built first — the shell's tsc pass resolves its types
      # from packages/ui/dist.
      - name: Build component library
        run: pnpm --filter @ledgr/ui build

      - name: Type check
        run: ./node_modules/.bin/tsc -p tsconfig.json

      # Reported, not enforced. The ratchet currently fails on pre-existing
      # violations, and this job gates production deploys — a design-token
      # regression should not be able to block shipping a backend fix.
      # Drop `continue-on-error` once the baseline is green again.
      - name: Design-token lint (advisory)
        continue-on-error: true
        run: node scripts/token-lint.mjs

      - name: Build
        run: pnpm --filter @ct/shell build

      # `pnpm exec vitest --run`, NOT `pnpm test --run`. pnpm 9 (what
      # action-setup installs here) parses `--run` as a pnpm flag and dies with
      # "Unknown option: 'run'"; only pnpm 10+ forwards it to the script. Local
      # dev is on pnpm 11, which is why this passed on a laptop and failed here.
      - name: Unit tests
        run: pnpm exec vitest --run
