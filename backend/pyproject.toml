[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aios-web-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlmodel==0.0.21",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "pgvector==0.3.2",
    "pydantic-settings==2.5.2",
    "PyJWT==2.8.0",
    "passlib[bcrypt]==1.7.4",
    "anthropic==0.34.2",
    "openai==1.47.0",
    "watchdog==5.0.2",
    "slowapi==0.1.9",
    "cryptography==43.0.1",
    "httpx==0.27.2",
    "python-multipart==0.0.9",
    "tiktoken==0.7.0",
    "websockets==13.1",
    "tenacity==9.0.0",
    "apscheduler==3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "aiosqlite==0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

